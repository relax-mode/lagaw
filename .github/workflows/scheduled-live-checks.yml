name: Scheduled live checks

# Live checks that must not run on every pull request: one paid AI extraction
# through deployed staging, and the Cloudflare deploy credential. A failure here
# notifies by email but never blocks merges or deploys.
on:
  schedule:
    - cron: "0 1 * * 1,4" # Mondays and Thursdays, 09:00 Asia/Manila
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-live-checks
  cancel-in-progress: false

jobs:
  ai-extraction:
    name: Live AI extraction (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The provider key stays in Secret Manager; this calls the deployed staging
      # API, which spends one extraction on the staging key. The API accepts only
      # Supabase sessions, so the check signs in as the dedicated smoke account.
      - name: Extract preferences through deployed staging
        env:
          STAGING_API_URL: https://lagaw-api-staging-i5kvldluga-as.a.run.app
          SMOKE_AUTH_EMAIL: ${{ secrets.SMOKE_AUTH_EMAIL }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
          SMOKE_SUPABASE_KEY: ${{ vars.SMOKE_SUPABASE_KEY }}
        run: |
          set -o pipefail
          python3 scripts/ai_live_smoke.py | tee -a "$GITHUB_STEP_SUMMARY"

  deploy-credentials:
    name: Cloudflare deploy credential
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler
        run: npm ci

      - name: Check that the Pages deploy token still works
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deployment list --project-name lagaw > /dev/null
          echo "Cloudflare Pages deploy credential accepted." >> "$GITHUB_STEP_SUMMARY"
