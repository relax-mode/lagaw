name: Lagaw CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new commit cancels an outdated pull request run. Main and manual runs each
# get their own group, so a deploy waiting in one run never queues or cancels
# checks for later commits; the deploy jobs serialize through their own groups.
concurrency:
  group: lagaw-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only the checks their changed paths need. A skipped job
  # still satisfies its required status check. If classification fails, every
  # check runs. Pushes and manual runs always run every check.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      database: ${{ steps.filter.outputs.database }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/smoke_deployed.py'
              - 'scripts/ai_live_smoke.py'
              - 'docs/evidence/week3-evaluation.json'
              - '.github/workflows/ci.yml'
            database:
              - 'backend/**'
              - 'supabase/**'
              - 'scripts/check_database.py'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend - Python
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.result != 'success' ||
       needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for backend project
        id: project
        working-directory: .
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.project.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        if: steps.project.outputs.exists == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python
        if: steps.project.outputs.exists == 'true'
        run: ruff check --output-format=github .

      - name: Check Python syntax
        if: steps.project.outputs.exists == 'true'
        run: python -m compileall -q app

      # Tests and the evaluation never reach the network or the paid provider:
      # the key is a dummy and real HTTPX transports go through an unreachable
      # proxy, so only mocked transports can answer.
      - name: Test backend regressions (offline, provider mocked)
        if: steps.project.outputs.exists == 'true'
        env:
          DEEPSEEK_API_KEY: ci-dummy-not-a-real-key
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,testserver
        run: python -m pytest -v -m "not db"

      - name: Evaluate AI fixtures (offline, provider mocked)
        if: steps.project.outputs.exists == 'true'
        env:
          DEEPSEEK_API_KEY: ci-dummy-not-a-real-key
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,testserver
        run: python evaluate_week3.py --output test-results/week3-evaluation.json

      # Pytest already requires the report to match the committed baseline. A PR
      # that intentionally refreshes the baseline (for example after a prompt
      # change) is compared with the target branch's baseline instead, so a quality
      # drop cannot hide inside a refreshed baseline.
      - name: Compare AI evaluation with the target branch baseline
        if: steps.project.outputs.exists == 'true'
        run: |
          set -o pipefail
          baseline=../docs/evidence/week3-evaluation.json
          if [ -n "$GITHUB_BASE_REF" ] && git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF" \
              && git show FETCH_HEAD:docs/evidence/week3-evaluation.json > test-results/target-baseline.json 2>/dev/null; then
            baseline=test-results/target-baseline.json
            echo "Comparing with the \`$GITHUB_BASE_REF\` baseline." >> "$GITHUB_STEP_SUMMARY"
          fi
          python compare_evaluation.py "$baseline" test-results/week3-evaluation.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload AI evaluation report
        if: always() && steps.project.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation
          path: backend/test-results/week3-evaluation.json
          if-no-files-found: ignore

  database:
    name: Database - PostgreSQL migrations and smoke tests
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.result != 'success' ||
       needs.changes.outputs.database == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lagaw_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: lagaw_test
      PGUSER: postgres
      PGPASSWORD: local_ci_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # GitHub's Ubuntu runner image ships psql; install it only if that changes.
      - name: Check PostgreSQL client
        run: psql --version || { sudo apt-get update && sudo apt-get install --yes postgresql-client; }
      - name: Apply migrations and verify database behavior
        run: python scripts/check_database.py --bootstrap-roles
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify SQLAlchemy trip relationships
        env:
          DATABASE_URL: postgresql+psycopg://postgres:local_ci_only@localhost:5432/lagaw_test?sslmode=disable
        run: python backend/verify_trip_relationships.py --ci
      - name: Start disposable PostgREST for association API tests
        run: |
          docker run --detach --name issue26-postgrest --network host \
            -e PGRST_DB_URI=postgresql://postgres:local_ci_only@127.0.0.1:5432/lagaw_test \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=service_role \
            -e PGRST_SERVER_HOST=127.0.0.1 \
            -e PGRST_SERVER_PORT=53000 \
            postgrest/postgrest:v12.2.3
      - name: Verify itinerary association API against disposable PostgreSQL
        timeout-minutes: 3
        run: python backend/verify_trip_items.py --ci
      # Tests marked `db` use only the disposable services above. Every nonzero
      # exit, including no tests collected, fails this required check.
      - name: Test database-backed API (pytest -m db)
        timeout-minutes: 5
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:local_ci_only@localhost:5432/lagaw_test?sslmode=disable
          CI_POSTGREST_URL: http://127.0.0.1:53000/
        run: python -m pytest -v -m db --junitxml=test-results/trip-integration.xml
      - name: Upload Trip database test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip-integration-results
          path: backend/test-results/trip-integration.xml
          if-no-files-found: warn
      - name: Remove disposable association test service
        if: always()
        run: docker rm --force issue26-postgrest || true

  frontend:
    name: Frontend - Flutter
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.result != 'success' ||
       needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      exists: ${{ steps.project.outputs.exists }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend project
        id: project
        working-directory: .
        run: |
          if [ -f frontend/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.project.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.project.outputs.exists == 'true'
        run: flutter pub get

      - name: Analyze Dart code
        if: steps.project.outputs.exists == 'true'
        run: flutter analyze

      - name: Test Flutter regressions
        if: steps.project.outputs.exists == 'true'
        run: flutter test

      # This build only proves the app compiles. Each deploy job builds its own
      # bundle with environment-scoped configuration, so this job needs no secrets.
      - name: Build Flutter Web
        if: steps.project.outputs.exists == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build web --release ${API_BASE_URL:+--dart-define=API_BASE_URL=$API_BASE_URL}

  staging-changes:
    name: Decide - Staging deployment
    needs: [backend, database, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      backend: ${{ steps.gate.outputs.backend }}
      frontend: ${{ steps.gate.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether staging needs an update
        id: gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          backend=false
          frontend=false

          zeros=0000000000000000000000000000000000000000
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$zeros" ]; then
            backend=true
            frontend=true
          elif ! files=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo "::warning::Could not compute changed files; updating staging to the main commit."
            backend=true
            frontend=true
          else
            while IFS= read -r path; do
              case "$path" in
                backend/test_*.py|backend/smoke_test.*|frontend/test/*) ;;
                backend/*|scripts/smoke_deployed.py) backend=true ;;
                frontend/*|package.json|package-lock.json) frontend=true ;;
                .github/workflows/ci.yml)
                  backend=true
                  frontend=true
                  ;;
              esac
            done <<< "$files"
          fi

          deploy=false
          if [ "$backend" = true ] || [ "$frontend" = true ]; then
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy - Staging
    needs: [backend, database, frontend, staging-changes]
    if: >-
      needs.staging-changes.outputs.deploy == 'true' &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check staging deployment configuration
        id: gate
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PROVIDER: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.STAGING_GCP_DEPLOYER_SERVICE_ACCOUNT }}
          RUNTIME: ${{ vars.STAGING_GCP_RUNTIME_SERVICE_ACCOUNT }}
          CORS: ${{ vars.STAGING_CORS_ALLOWED_ORIGINS }}
          TRIP_DEMO_USER_ID: ${{ vars.STAGING_TRIP_DEMO_USER_ID }}
          TRIP_DEMO_TOKEN: ${{ secrets.STAGING_TRIP_DEMO_TOKEN }}
          SMOKE_AUTH_EMAIL: ${{ secrets.SMOKE_AUTH_EMAIL }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
          SMOKE_SUPABASE_KEY: ${{ vars.SMOKE_SUPABASE_KEY }}
          SMOKE_PROFILE_ID: ${{ vars.SMOKE_PROFILE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in PROJECT REGION PROVIDER DEPLOYER RUNTIME CORS TRIP_DEMO_USER_ID TRIP_DEMO_TOKEN SMOKE_AUTH_EMAIL SMOKE_AUTH_PASSWORD SMOKE_SUPABASE_KEY SMOKE_PROFILE_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!v}" ] || { echo "::error::Staging deployment configuration is missing ($v)."; exit 1; }
          done
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.backend == 'true'
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push staging image
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lagaw/api:staging-${{ github.sha }}
          cache-from: type=gha,scope=lagaw-staging
          cache-to: type=gha,scope=lagaw-staging,mode=max

      - name: Deploy backend to staging Cloud Run
        id: deploy-backend-staging
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.backend == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: lagaw-api-staging
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lagaw/api:staging-${{ github.sha }}
          env_vars: |
            CORS_ALLOWED_ORIGINS=${{ vars.STAGING_CORS_ALLOWED_ORIGINS }}
            TRIP_AUTH_MODE=supabase
            DEEPSEEK_MODEL=deepseek-flash
            DEEPSEEK_TIMEOUT_MS=20000
          secrets: |
            SUPABASE_URL=STAGING_SUPABASE_URL:2
            SUPABASE_SERVICE_ROLE_KEY=STAGING_SUPABASE_SERVICE_ROLE_KEY:2
            DEEPSEEK_API_KEY=STAGING_DEEPSEEK_API_KEY:1
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.STAGING_GCP_RUNTIME_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=512Mi
            --concurrency=20
            --timeout=60
            --port=8080

      - name: Read existing staging API URL
        id: existing-staging-api
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.backend != 'true'
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          url=$(gcloud run services describe lagaw-api-staging --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          [ -n "$url" ] || { echo "::error::Staging Cloud Run URL is missing."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test staging API
        if: steps.gate.outputs.deploy == 'true'
        env:
          SMOKE_API_URL: ${{ steps.deploy-backend-staging.outputs.url || steps.existing-staging-api.outputs.url }}
          SMOKE_AUTH_EMAIL: ${{ secrets.SMOKE_AUTH_EMAIL }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
          SMOKE_SUPABASE_KEY: ${{ vars.SMOKE_SUPABASE_KEY }}
          SMOKE_PROFILE_ID: ${{ vars.SMOKE_PROFILE_ID }}
        run: python3 scripts/smoke_deployed.py staging

      - name: Set up Flutter
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.frontend == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.frontend == 'true'
        working-directory: frontend
        run: flutter pub get

      - name: Build staging Flutter Web
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.frontend == 'true'
        working-directory: frontend
        env:
          API_BASE_URL: ${{ steps.deploy-backend-staging.outputs.url || steps.existing-staging-api.outputs.url }}
          TRIP_DEMO_TOKEN: ${{ secrets.STAGING_TRIP_DEMO_TOKEN }}
        run: flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=TRIP_DEMO_TOKEN="$TRIP_DEMO_TOKEN"

      - name: Set up Node.js
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.frontend == 'true'
        run: npm ci

      - name: Deploy staging Flutter Web
        id: deploy-staging-web
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.frontend == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          npx wrangler pages deploy frontend/build/web \
            --project-name lagaw \
            --branch staging \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true | tee deploy-staging.log
          url=$(python -c 'import pathlib, re, sys; matches = re.findall(r"https://[A-Za-z0-9.-]+\.pages\.dev", pathlib.Path(sys.argv[1]).read_text()); print(matches[-1] if matches else "")' deploy-staging.log)
          [ -n "$url" ] || { echo "::error::Could not determine the staging Pages URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "API: ${{ steps.deploy-backend-staging.outputs.url || steps.existing-staging-api.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Web: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test staging Flutter Web
        if: steps.gate.outputs.deploy == 'true' && needs.staging-changes.outputs.frontend == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy-staging-web.outputs.url }}
        run: |
          set -eo pipefail
          [ -n "$DEPLOY_URL" ] || { echo "::error::Staging Pages URL is missing."; exit 1; }
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 30 \
            "$DEPLOY_URL" --output /dev/null
          echo "Staging Pages HTTP smoke test passed: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

  # Production follows staging automatically. After a main push passes the
  # checks and the staging deploy and its smoke tests, the same commit is promoted:
  # the API reuses the image staging tested, and the web app is rebuilt with
  # production configuration. A manual run on main redeploys production for recovery.
  deploy-backend:
    name: Deploy - Production API
    needs: [backend, database, frontend, staging-changes, deploy-staging]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.backend.result == 'success' && needs.database.result == 'success' &&
      needs.frontend.result == 'success' &&
      ((github.event_name == 'push' && needs.staging-changes.outputs.backend == 'true' &&
        needs.deploy-staging.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false

    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lagaw/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check production deployment configuration
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          RUNTIME: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          CORS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          SMOKE_AUTH_EMAIL: ${{ secrets.SMOKE_AUTH_EMAIL }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
          SMOKE_SUPABASE_KEY: ${{ vars.SMOKE_SUPABASE_KEY }}
          SMOKE_PROFILE_ID: ${{ vars.SMOKE_PROFILE_ID }}
        run: |
          for v in PROJECT REGION PROVIDER DEPLOYER RUNTIME CORS SMOKE_AUTH_EMAIL SMOKE_AUTH_PASSWORD SMOKE_SUPABASE_KEY SMOKE_PROFILE_ID; do
            [ -n "${!v}" ] || { echo "::error::Production deployment configuration is missing ($v)."; exit 1; }
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Promote the image staging tested
        if: github.event_name == 'push'
        run: gcloud artifacts docker tags add "$IMAGE:staging-$GITHUB_SHA" "$IMAGE:$GITHUB_SHA" --quiet

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (manual recovery run)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: lagaw-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
            TRIP_AUTH_MODE=supabase
            DEEPSEEK_MODEL=deepseek-flash
            DEEPSEEK_TIMEOUT_MS=20000
          secrets: |
            SUPABASE_URL=SUPABASE_URL:1
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:1
            DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:1
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=512Mi
            --concurrency=20
            --timeout=60
            --port=8080

      - name: Smoke test production API
        env:
          SMOKE_API_URL: ${{ steps.deploy.outputs.url }}
          SMOKE_AUTH_EMAIL: ${{ secrets.SMOKE_AUTH_EMAIL }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
          SMOKE_SUPABASE_KEY: ${{ vars.SMOKE_SUPABASE_KEY }}
          SMOKE_PROFILE_ID: ${{ vars.SMOKE_PROFILE_ID }}
        run: |
          python3 scripts/smoke_deployed.py production
          echo "### Production API deployed and smoke-tested: $SMOKE_API_URL" >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: Deploy - Production web
    needs: [backend, database, frontend, staging-changes, deploy-staging, deploy-backend]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.backend.result == 'success' && needs.database.result == 'success' &&
      needs.frontend.result == 'success' && needs.frontend.outputs.exists == 'true' &&
      needs.deploy-backend.result != 'failure' && needs.deploy-backend.result != 'cancelled' &&
      ((github.event_name == 'push' && needs.staging-changes.outputs.frontend == 'true' &&
        needs.deploy-staging.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://lagaw.pages.dev

    concurrency:
      group: deploy-web-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check production web configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          TRIP_DEMO_TOKEN: ${{ secrets.TRIP_DEMO_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in API_BASE_URL TRIP_DEMO_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!v}" ] || { echo "::error::Production web configuration is missing ($v)."; exit 1; }
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build production Flutter Web
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          TRIP_DEMO_TOKEN: ${{ secrets.TRIP_DEMO_TOKEN }}
        run: flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=TRIP_DEMO_TOKEN="$TRIP_DEMO_TOKEN"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler
        run: npm ci

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          npx wrangler pages deploy frontend/build/web \
            --project-name lagaw \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true | tee deploy.log
          url=$(python -c 'import pathlib, re, sys; matches = re.findall(r"https://[A-Za-z0-9.-]+\.pages\.dev", pathlib.Path(sys.argv[1]).read_text()); print(matches[-1] if matches else "")' deploy.log)
          [ -n "$url" ] || { echo "::error::Could not determine the Cloudflare Pages deployment URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test production web
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -eo pipefail
          for url in "$DEPLOY_URL" https://lagaw.pages.dev; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 30 "$url" --output /dev/null
          done
          echo "### Production web deployed: $DEPLOY_URL (https://lagaw.pages.dev)" >> "$GITHUB_STEP_SUMMARY"
