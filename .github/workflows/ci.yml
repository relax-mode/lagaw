
name: Lagaw CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lagaw-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend - Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for backend project
        id: project
        working-directory: .
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.project.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        if: steps.project.outputs.exists == 'true'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install ruff

      - name: Lint Python
        if: steps.project.outputs.exists == 'true'
        run: ruff check .

      - name: Check Python syntax
        if: steps.project.outputs.exists == 'true'
        run: python -m compileall -q app

      - name: Test backend regressions (offline)
        if: steps.project.outputs.exists == 'true'
        run: python -m pytest -v

  database:
    name: Database - PostgreSQL migrations and smoke tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lagaw_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: lagaw_test
      PGUSER: postgres
      PGPASSWORD: local_ci_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply migrations and verify database behavior
        run: python scripts/check_database.py --bootstrap-roles
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify SQLAlchemy trip relationships
        env:
          DATABASE_URL: postgresql+psycopg://postgres:local_ci_only@localhost:5432/lagaw_test?sslmode=disable
        run: python backend/verify_trip_relationships.py --ci

  frontend:
    name: Frontend - Flutter
    runs-on: ubuntu-latest

    outputs:
      exists: ${{ steps.project.outputs.exists }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend project
        id: project
        working-directory: .
        run: |
          if [ -f frontend/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.project.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.project.outputs.exists == 'true'
        run: flutter pub get

      - name: Test Flutter regressions
        if: steps.project.outputs.exists == 'true'
        run: flutter test

      - name: Analyze Dart code
        if: steps.project.outputs.exists == 'true'
        run: flutter analyze

      - name: Build Flutter Web
        if: steps.project.outputs.exists == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build web --release ${API_BASE_URL:+--dart-define=API_BASE_URL=$API_BASE_URL}

      - name: Upload web build
        if: steps.project.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/build/web
          if-no-files-found: error

  # Reuses the web build from the frontend job, so each run builds once.
  # main publishes to production; same-repo pull requests publish a preview.
  deploy-web:
    name: Deploy - Cloudflare Pages
    needs: [backend, database, frontend]
    if: >-
      needs.frontend.outputs.exists == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-web-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every check skips with a visible reason instead of failing, so CI stays
      # green until there is something real to serve.
      - name: Decide whether to deploy
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          skip() {
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy: $1"
            echo "Deploy skipped: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          [ -f frontend/web/index.html ] || skip "the Flutter project has no web platform (run 'flutter create --platforms=web .' in frontend/)."
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || skip "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set."

          # PR previews deploy frontend changes only. Main also republishes for CI
          # workflow changes. Docs-only and test-only changes never publish. Manual
          # runs always deploy, as does any case where the diff cannot be computed.
          zeros=0000000000000000000000000000000000000000
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zeros" ]; then
            range="$BEFORE_SHA..$GITHUB_SHA"
          fi

          if [ -n "$range" ]; then
            if ! files=$(git diff --name-only "$range" 2>/dev/null); then
              echo "::warning::Could not compute the changed files; deploying anyway."
            else
              deploy_web=false
              while IFS= read -r path; do
                case "$path" in
                  frontend/test/*) ;;
                  frontend/*|package.json|package-lock.json) deploy_web=true ;;
                  .github/workflows/ci.yml)
                    [ "$EVENT_NAME" = "push" ] && deploy_web=true
                    ;;
                esac
              done <<< "$files"
              [ "$deploy_web" = true ] || skip "no frontend or deploy-config changes (docs-only and test-only changes do not deploy)."
            fi
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Download web build
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: frontend/build/web

      - name: Set up Node.js
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler
        if: steps.gate.outputs.deploy == 'true'
        run: npm ci

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eo pipefail
          npx wrangler pages deploy frontend/build/web             --project-name lagaw             --branch "$DEPLOY_BRANCH"             --commit-hash "$GITHUB_SHA"             --commit-dirty=true | tee deploy.log
          url=$(python -c 'import pathlib, re, sys; matches = re.findall(r"https://[A-Za-z0-9.-]+\.pages\.dev", pathlib.Path(sys.argv[1]).read_text()); print(matches[-1] if matches else "")' deploy.log)
          [ -n "$url" ] || { echo "::error::Could not determine the Cloudflare Pages deployment URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Pages deployment ($DEPLOY_BRANCH)" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test Cloudflare Pages deployment
        if: steps.gate.outputs.deploy == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -eo pipefail
          [ -n "$DEPLOY_URL" ] || { echo "::error::Deployment URL is missing."; exit 1; }
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 30 \
            "$DEPLOY_URL" --output /dev/null
          echo "HTTP smoke test passed: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

  deploy-backend:
    name: Deploy - Cloud Run
    needs: [backend, database, frontend]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: deploy-backend
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to deploy
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          RUNTIME: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          CORS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          skip() {
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy: $1"
            echo "Deploy skipped: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          [ -f backend/Dockerfile ] || skip "backend/Dockerfile is missing."

          if [ "$EVENT_NAME" = "push" ]; then
            zeros=0000000000000000000000000000000000000000
            [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zeros" ] || skip "the push base commit cannot be resolved."
            changed=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
            deploy_backend=false
            while IFS= read -r path; do
              case "$path" in
                backend/test_*.py|backend/smoke_test.*) ;;
                backend/*|.github/workflows/ci.yml) deploy_backend=true ;;
              esac
            done <<< "$changed"
            [ "$deploy_backend" = true ] || skip "no backend runtime or deploy workflow changes were made."
          fi

          for v in PROJECT REGION PROVIDER DEPLOYER RUNTIME CORS; do
            [ -n "${!v}" ] || skip "the GCP_* repository variables are not set ($v)."
          done

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: steps.gate.outputs.deploy == 'true'
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        if: steps.gate.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.gate.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lagaw/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: lagaw-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lagaw/api:${{ github.sha }}
          env_vars: |
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
          secrets: |
            SUPABASE_URL=SUPABASE_URL:latest
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=512Mi
            --concurrency=20
            --timeout=60
            --port=8080

      - name: Smoke test
        if: steps.gate.outputs.deploy == 'true'
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -eo pipefail
          [ -n "$SERVICE_URL" ] || { echo "::error::Cloud Run service URL is missing."; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 \
            "$SERVICE_URL/locations?limit=1" | python -c "import sys,json; d=json.load(sys.stdin); assert d['items'], 'no locations returned'; print('smoke test ok:', len(d['items']), 'location')"
          echo "### Cloud Run deployment smoke test passed" >> "$GITHUB_STEP_SUMMARY"
